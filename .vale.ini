StylesPath = .vale/styles
MinAlertLevel = error
Packages = Google

[*.md]
BasedOnStyles = Google, AptlProject
# Lab docs quote literal config values ("512MB" mem_limit, "300s"
# timeout). Inserting a space between number and unit would make the
# prose diverge from the strings that actually appear in compose files
# and CLI output.
Google.Units = NO
Google.Contractions = NO

# Generated artifact: CHANGELOG.md is produced by release-please, not
# hand-maintained prose worth gating.
[CHANGELOG.md]
BasedOnStyles =

[changelog.d/*.md]
BasedOnStyles =

# Agent contracts must name their tools precisely. All other prose rules apply.
[{.claude,.gc,.github}/**]
AptlProject.WorkflowPlatformName = NO

[{AGENTS,CLAUDE}.md]
AptlProject.WorkflowPlatformName = NO
