name: Checks

# Single quality + security gate. APTL itself is local-first and has no
# app deployment; the only deploy is the docs site, which lives in
# docs-deploy.yml (GitHub Pages, main only). All checks below run in
# parallel after changed-input selection; SonarCloud waits for tests to
# ingest their coverage.
#
# Required repo secrets:
#   SONAR_TOKEN — SonarCloud authentication
on:
  push:
    branches: [main, dev, go-cutover]
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main, dev, go-cutover]

env:
  COVERAGE_CORE: sysmon

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Select changed inputs
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.select.outputs.python }}
      mcp: ${{ steps.select.outputs.mcp }}
      web: ${{ steps.select.outputs.web }}
      docs: ${{ steps.select.outputs.docs }}
      dependencies: ${{ steps.select.outputs.dependencies }}
      lab: ${{ steps.select.outputs.lab }}
      images: ${{ steps.select.outputs.images }}
      iac: ${{ steps.select.outputs.iac }}
      go: ${{ steps.select.outputs.go }}
      selected_images: ${{ steps.select.outputs.selected_images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - run: pip install --require-hashes -r requirements/ci.txt
      - id: select
        run: python tools/ci/select_checks.py

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    needs: [changes]
    if: always()
    concurrency:
      group: checks-pre-commit-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install --require-hashes -r requirements/ci.txt
      # The gofmt hook uses the toolchain that go.mod pins.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Secrets and fast hygiene
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Dependency freshness and complexity (CI only)
        run: pre-commit run --config .pre-commit-ci.yaml --all-files --show-diff-on-failure

  docs:
    name: Docs (Vale prose lint + mkdocs strict build)
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.docs == 'true')
    concurrency:
      group: checks-docs-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-revision-date-localized needs full history for page dates
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: |
          pip install --require-hashes -r requirements/docs.txt
          pip install -e . --no-deps --no-build-isolation
      - name: Vale prose lint (full lintable corpus, ADR-038)
        run: bash tools/vale-lint-all.sh
      - name: mkdocs strict build (nav and links must resolve)
        run: mkdocs build --strict

  python-test-shards:
    name: Python suite (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.python == 'true')
    concurrency:
      group: checks-python-test-shards-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.shard }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install -e . --no-deps --no-build-isolation
      - name: Ordinary tests and worker coverage
        run: >-
          python -m pytest tests/ -q -n 4 --dist loadfile
          --splits ${{ strategy.job-total }} --group ${{ matrix.shard }} --splitting-algorithm least_duration
          -m "not integration and not fuzz and not live_lab" --durations=30
          --junitxml=python-results.xml --cov --cov-report=
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-data-${{ matrix.shard }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-test-results-${{ matrix.shard }}
          path: python-results.xml
          retention-days: 7

  python-qualification:
    name: Python fuzz, measurement and smoke checks
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.python == 'true')
    concurrency:
      group: checks-python-qualification-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install -e . --no-deps --no-build-isolation
      - name: Compare measurement cores when the toolchain changes
        if: needs.changes.outputs.python == 'true' && needs.changes.outputs.dependencies == 'true'
        run: |
          for core in sysmon ctrace; do
            COVERAGE_CORE=$core coverage run --data-file="$RUNNER_TEMP/coverage-$core" -m pytest tests/test_raes_planning_compat.py -q
            coverage json --data-file="$RUNNER_TEMP/coverage-$core" -o "$RUNNER_TEMP/coverage-$core.json"
          done
          COVERAGE_FILE="$RUNNER_TEMP/coverage-workers" python -m pytest tests/test_raes_planning_compat.py -q -n 2 --cov --cov-report="json:$RUNNER_TEMP/coverage-workers.json"
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          reports = []
          for core in ("sysmon", "ctrace"):
              report = json.loads((root / f"coverage-{core}.json").read_text())
              reports.append({name: data["executed_lines"] for name, data in report["files"].items()})
          assert reports[0] == reports[1], "coverage cores disagree on executed lines"
          worker_report = json.loads((root / "coverage-workers.json").read_text())
          planner = "src/aptl/backends/raes_planning_compat.py"
          assert reports[0][planner], "serial planner coverage is empty"
          assert worker_report["files"][planner]["executed_lines"] == reports[0][planner], "worker coverage differs from serial planner coverage"
          print("Coverage cores agree on measured files and executed lines")
          PYTHON
      # Property-based tests carry the `fuzz` marker, which `addopts` excludes
      # from the default run above. Without this step no gate ran them, and two
      # went stale behind contract changes (#1141, #1152) unnoticed (#1193).
      - name: Property-based (fuzz) tests
        run: python -m pytest tests/ -q -m "fuzz and not integration and not live_lab" --durations=10
      # The env-file writers must deliver each value exactly (#966). Only the
      # real Docker and Compose readers can prove that. The readback tests are
      # integration-marked, so the run above deselects them. The runner has
      # Docker and Compose. The probes stop the step if either is missing, so
      # the tests cannot pass by a skip.
      - name: Env-file readback through Docker and Compose
        run: |
          docker info > /dev/null
          docker compose version
          python -m pytest -q -m integration \
            tests/test_raes_runtime_environment.py::test_docker_reads_the_env_file_back_exactly \
            tests/test_deployment_stateful_realization.py::test_compose_reads_the_generated_env_file_back_exactly
      # The capture sidecar must open a PTY session with exactly its shipped
      # capabilities (#1496). Only a real image and sshd can prove that. This
      # module is integration-marked, so the run above deselects it. The probes
      # stop the step if Docker or an SSH client tool is missing, so the tests
      # cannot pass by a skip.
      - name: Kali capture sidecar sessions through Docker
        run: |
          docker info > /dev/null
          command -v ssh ssh-keygen
          python -m pytest -q -m integration tests/test_kali_capture_compose.py
      # Mixed realization starts a materialized base container and a generated
      # Compose service together. Only a real Docker daemon can prove that. The
      # module is integration-marked, so the runs above deselect it. The probe
      # stops the step if Docker is missing, so the test cannot pass by a skip.
      - name: Mixed base-container and Compose realization through Docker
        run: |
          docker info > /dev/null
          python -m pytest -q -m integration tests/test_mixed_realization_integration.py
      - name: Linux CLI and init smoke
        run: |
          lilrae --help
          lilrae lab init "$RUNNER_TEMP/cli-smoke"

  python-tests:
    name: Python tests + coverage
    runs-on: ubuntu-latest
    needs: [changes, python-test-shards, python-qualification]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.python == 'true')
    concurrency:
      group: checks-python-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Require complete Python verification
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
          SHARD_RESULT: ${{ needs.python-test-shards.result }}
          QUALIFICATION_RESULT: ${{ needs.python-qualification.result }}
        run: |
          test "$ROUTING_RESULT" = success
          test "$SHARD_RESULT" = success
          test "$QUALIFICATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - run: |
          pip install --require-hashes -r requirements/ci.txt
          pip install -e . --no-deps --no-build-isolation
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-coverage-data-*
          path: coverage-data
      - name: Combine complete worker coverage
        run: |
          set -euo pipefail
          for shard in 1 2 3; do
            data="coverage-data/python-coverage-data-$shard/.coverage"
            test -s "$data"
            coverage json --data-file="$data" -o "$RUNNER_TEMP/coverage-shard-$shard.json"
          done
          coverage combine coverage-data/python-coverage-data-1/.coverage coverage-data/python-coverage-data-2/.coverage coverage-data/python-coverage-data-3/.coverage
          coverage xml -o coverage.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  scenario-verification-artifacts:
    name: Scenario verification installed-artifact boundary
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.lab == 'true')
    concurrency:
      group: checks-scenario-verification-artifacts-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install the hash-verified test and build toolchain
        run: pip install --require-hashes -r requirements/dev.txt
      - name: Prove core-only and separately installed verifier wheels
        run: >-
          python -m pytest tests/test_scenario_verification_artifacts.py tests/test_lab_core_only_artifact.py -q
          -m integration
      # Independent family adapter wheels run outside the source tree on the
      # released RAES tuple (#1465). The modules are integration-marked, so the
      # ordinary runs deselect them.
      - name: Prove installed family adapters on the released RAES tuple
        run: >-
          python -m pytest tests/test_family_adapter_contract.py tests/test_structural_factorial_family.py -q
          -m integration

  pack-identity-compatibility:
    name: Admitted pack identity and plugin qualification
    runs-on: ubuntu-latest
    # Issue #879: the verifier declared scenario content the admitted pack does
    # not carry, and no gate noticed, because every other test built its context
    # from the plugin's own declaration. These tests resolve the identity through
    # env-packs' real validation path and fail on any drift. They are
    # integration-marked (staging and validating a pack is not fast-suite work)
    # but need no Docker, so they run here rather than nowhere.
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.lab == 'true')
    concurrency:
      group: checks-pack-identity-compatibility-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install -e . --no-deps --no-build-isolation
      - name: Bind every installed plugin's declaration to the admitted pack
        run: >-
          python -m pytest tests/test_env_pack_bundle.py
          tests/test_plugin_pack_compatibility.py -q -m integration

  python-cross-platform:
    name: Python cross-platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pytest_args: >-
              tests/test_cli_config.py tests/test_cli_lifecycle.py tests/test_config.py
              tests/test_env.py tests/test_env_hydration.py tests/test_hostenv.py
              tests/test_lab_init_cli.py tests/test_lifecycle_policy.py
              tests/test_session.py tests/test_sysreqs.py tests/test_line_endings.py
              tests/test_workbench_process.py tests/test_version.py
              -q -m "not integration and not fuzz and not live_lab"
          - os: windows-latest
            pytest_args: >-
              tests/test_cli.py
              tests/test_cli_config.py
              tests/test_cli_lifecycle.py
              tests/test_config.py
              tests/test_env.py
              tests/test_env_hydration.py
              tests/test_hostenv.py
              tests/test_lab_init_cli.py
              tests/test_lifecycle_policy.py
              tests/test_session.py
              tests/test_sysreqs.py
              tests/test_version.py
              tests/test_version_consistency.py
              tests/test_line_endings.py
              tests/test_workbench_process.py
              -q
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.python == 'true')
    concurrency:
      group: checks-python-cross-platform-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.os }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Validate check selection
        shell: bash
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Python portable suite without lab integration
        run: python -m pytest ${{ matrix.pytest_args }}
      - name: CLI import and help smoke
        run: lilrae --help
      - name: Lab init smoke
        run: lilrae lab init ci-lab

  raes-scenario-gate:
    name: RAES scenario validation gate
    runs-on: ubuntu-latest
    # SCN-010E / #322. The static validation gate parses the authoritative
    # techvault-operational SDL and spawns the `raes conformance backend` CLI,
    # so it is integration-marked and runs here rather than in the fast
    # python-tests suite. Blocking since issue #1193 (the Phase B cutover): it
    # passed consistently in its advisory Phase A. The gate needs only the
    # installed raes wheel (which bundles the contract corpus) and the
    # `raes` CLI — no separate corpus checkout.
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.lab == 'true')
    concurrency:
      group: checks-raes-scenario-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install -e . --no-deps --no-build-isolation
      - name: Generate lab SSH keys
        # issue #581: the operational scenario's content: now declares the
        # SSH-reachable targets' authorized_keys (SEC #417), sourced from the
        # gitignored keys/ and config/lab-ssh/ files lab start generates —
        # the static gate resolves and requires that source file to exist on
        # disk, so it must be generated before the gate runs, same as it
        # would be by the time a real `lilrae lab start` reaches content
        # placement.
        run: |
          python -c "
          from pathlib import Path
          from aptl.core.ssh import ensure_ssh_keys, ensure_pivot_key, ensure_target_authorized_keys
          project = Path('.')
          keys_dir = project / 'keys'
          pivot_dir = project / 'config' / 'lab-ssh'
          assert ensure_ssh_keys(keys_dir=keys_dir, host_ssh_dir=Path.home() / '.ssh').success
          assert ensure_pivot_key(pivot_dir=pivot_dir).success
          assert ensure_target_authorized_keys(keys_dir=keys_dir, pivot_dir=pivot_dir).success
          "
      - name: RAES static validation gate (techvault-operational)
        # -n auto runs the parse / compile / conformance-CLI checks in parallel
        # via pytest-xdist. No coverage is collected here, so xdist worker
        # measurement is not a concern.
        run: python -m pytest tests/test_techvault_static_gate.py -q -m integration -n auto

  fresh-start-preflight:
    name: Fresh-install lab-start pre-flight (issue #951)
    runs-on: ubuntu-latest
    # Blocking, and deliberately separate from `python-tests`: this is the
    # read-only counterpart to `clean-install-lab-boot`, checked from a freshly
    # materialized project directory without booting containers. The fixture is
    # product-neutral; scenario-specific behavior belongs behind adapters.
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.lab == 'true')
    concurrency:
      group: checks-fresh-start-preflight-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install -e . --no-deps --no-build-isolation
      - run: python -m pytest tests/test_lab_fresh_start.py -q -m integration

  clean-install-lab-boot:
    name: Clean-install lab boot and teardown (DEP-008)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # DEP-008 promises a wheel-installed CLI can init, start, observe, and stop
    # a lab with no source import. Every other job installs the checkout
    # editable, and developer state can hide packaging/lifecycle defects. This
    # job supplies a product-neutral SDL as an adapter would, then exercises the
    # public CLI and independently reads the realized container state.
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.lab == 'true')
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Build the wheel with the locked, no-isolation toolchain
        run: |
          pip install --require-hashes -r requirements/ci.txt
          python -m build --wheel --no-isolation --outdir dist/
      - name: Install the wheel into a clean virtual environment
        # Deliberately NOT `pip install -e .`, not the checkout's CLI, and not
        # the local pack-interaction plugin: any of those would test something
        # other than the artifact users install. `--no-deps` after the locked
        # runtime set keeps the dependency closure pinned and hash-verified.
        run: |
          python -m venv "$RUNNER_TEMP/clean-venv"
          "$RUNNER_TEMP/clean-venv/bin/pip" install --require-hashes -r requirements/runtime.txt
          "$RUNNER_TEMP/clean-venv/bin/pip" install --no-deps dist/*.whl
      - name: Verify the installed commands and the deprecated aliases
        # Issue #1402: the wheel installs `lilrae` and keeps `aptl` as a
        # deprecated alias until 10.0.0. The alias prints exactly one notice
        # to stderr and leaves stdout unchanged.
        run: |
          bin="$RUNNER_TEMP/clean-venv/bin"
          for command in lilrae lilrae-misp-suricata-sync aptl aptl-misp-suricata-sync; do
            test -x "$bin/$command"
          done
          primary=$("$bin/lilrae" --version 2>"$RUNNER_TEMP/primary.err")
          legacy=$("$bin/aptl" --version 2>"$RUNNER_TEMP/legacy.err")
          test "$primary" = "$legacy"
          grep -Eq '^lilrae [0-9]' <<<"$primary"
          test ! -s "$RUNNER_TEMP/primary.err"
          test "$(grep -c "the 'aptl' command is deprecated" "$RUNNER_TEMP/legacy.err")" -eq 1
          quiet=$(LILRAE_SUPPRESS_APTL_DEPRECATION=1 "$bin/aptl" --version 2>"$RUNNER_TEMP/quiet.err")
          test "$quiet" = "$primary"
          test ! -s "$RUNNER_TEMP/quiet.err"
      - name: Materialize a lab project from the installed package
        # Run from an empty directory so nothing in the checkout can satisfy an
        # asset the wheel forgot to ship.
        run: |
          mkdir -p "$RUNNER_TEMP/clean-install"
          cd "$RUNNER_TEMP/clean-install"
          "$RUNNER_TEMP/clean-venv/bin/lilrae" lab init ci-lab
          mkdir -p ci-lab/scenarios
          cp "$GITHUB_WORKSPACE/tests/fixtures/packs/materialization-envelope/sdl/materialization-envelope.sdl.yaml" \
            ci-lab/scenarios/materialization-envelope.sdl.yaml
          test ! -e ci-lab/config/soc_certs
          test ! -e ci-lab/.aptl
      - name: Record the daemon baseline before the lab starts
        # Anonymous volumes and ephemeral helper containers carry no project
        # identity, so the project-scoped cleanup proof cannot attribute them.
        # Recording what the daemon already holds lets that proof fail on any
        # the lab leaves behind. It observes only; it deletes nothing.
        run: |
          "$RUNNER_TEMP/clean-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/ci/assert_project_teardown.py" \
            "$RUNNER_TEMP/clean-install/ci-lab" \
            --record-baseline "$RUNNER_TEMP/daemon-baseline.json"
      - name: Start and verify the materialization envelope
        run: |
          cd "$RUNNER_TEMP/clean-install/ci-lab"
          "$RUNNER_TEMP/clean-venv/bin/python" \
            "$GITHUB_WORKSPACE/tests/fixtures/lilrae_core_only_cli.py" lab start \
            --scenario-path scenarios/materialization-envelope.sdl.yaml
          status_output=$("$RUNNER_TEMP/clean-venv/bin/lilrae" lab status)
          grep -F "Lab is running." <<<"$status_output"
          project_name=$("$RUNNER_TEMP/clean-venv/bin/python" -c '
          from pathlib import Path
          from aptl.core.config import load_config
          from aptl.core.deployment._compose_resource_ownership import WorkspaceOwnership
          config = load_config(Path("aptl.json"))
          ownership = WorkspaceOwnership.load(Path.cwd(), config.deployment.project_name)
          if ownership is None:
              raise SystemExit("lab project ownership is unavailable")
          print(ownership.project_name)
          ')
          container_ids=$(docker ps -q \
            --filter "label=com.docker.compose.project=$project_name" \
            --filter label=aptl.node.address=provision.node.smoke-box)
          test -n "$container_ids"
          test "$(printf '%s\n' "$container_ids" | wc -l)" -eq 1
          container_id=$container_ids
          docker exec "$container_id" dpkg-query -W curl
          test "$(docker exec "$container_id" id -u analyst)" -gt 0
          test "$(docker exec "$container_id" \
            stat -c '%U:%G %a' /var/lib/aptl-smoke)" = "analyst:analysts 750"
      - name: Verify the realization regressions the scenario declares
        # Issue #993. The checks above observe packages, accounts and
        # filesystem state; these are the realization surfaces that shipped
        # defects the boot gate could not see: content that must execute, the
        # service it configures, the listener and host publication that service
        # produces, and the orchestrator workflow. They form one causal chain,
        # so the content placement cannot silently no-op and leave the rest
        # passing. The verifier runs from the clean venv, against the installed
        # package's own identities.
        run: |
          cd "$RUNNER_TEMP/clean-install/ci-lab"
          "$RUNNER_TEMP/clean-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/ci/assert_boot_realization.py" . \
            --node-address provision.node.smoke-box \
            --content-path /etc/ssh/sshd_config.d/10-aptl-smoke.conf \
            --content-text $'Port 2022\n' \
            --unit-name ssh.service \
            --container-port 2022 \
            --protocol tcp \
            --host-ip 127.0.0.1 \
            --host-port 32022 \
            --endpoint-banner-prefix SSH- \
            --network-name smoke-net \
            --network-alias smoke-box \
            --workflow-address orchestration.workflow.smoke-control
      - name: Stop the lab and remove its volumes
        if: always()
        run: |
          cd "$RUNNER_TEMP/clean-install/ci-lab"
          "$RUNNER_TEMP/clean-venv/bin/lilrae" lab stop --volumes --yes
      - name: Assert no project containers, networks, or volumes remain
        if: always()
        run: |
          "$RUNNER_TEMP/clean-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/ci/assert_project_teardown.py" \
            "$RUNNER_TEMP/clean-install/ci-lab" \
            --baseline "$RUNNER_TEMP/daemon-baseline.json"

  mcp-tests:
    name: MCP TypeScript tests + coverage
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.mcp == 'true')
    concurrency:
      group: checks-mcp-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: aptl-mcp-common — install, build, test
        # `npm run build` runs explicitly before mcp-red copies the build
        # output. The `prepare` script also builds, but ordering across
        # `npm ci` and `npx vitest run --coverage` is not load-bearing
        # — the explicit build keeps the contract obvious and the mcp-red
        # step below dependable.
        # `npm ci` rather than `npm install`: it installs exactly what
        # package-lock.json pins and fails if the lock and manifest disagree,
        # which is what makes the dependency set reproducible (issue #847).
        # The `sed` rewrites LCOV `SF:src/...` paths to repo-root-relative
        # `SF:mcp/aptl-mcp-common/src/...` so SonarCloud can match coverage
        # against the actual project tree (Sonar resolves SF: paths against
        # `sonar.sources`, which is anchored at the repo root).
        run: |
          cd mcp/aptl-mcp-common
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npx vitest run --coverage
          sed -i 's|^SF:|SF:mcp/aptl-mcp-common/|' coverage/lcov.info
      - name: mcp-red — install (rebuilds against fresh common), test, and coverage
        # mcp-red consumes aptl-mcp-common via `file:`. npm copies the
        # *current* build artifact at install time, so the explicit
        # `npm run build` above must have produced fresh `build/` first.
        # `npm ci` removes node_modules wholesale before installing from the
        # lockfile, so it re-copies the freshly built common on its own — the
        # explicit `rm -rf node_modules/aptl-mcp-common` the old `npm install`
        # path needed is no longer required.
        # `sed` rewrites LCOV paths so SonarCloud matches coverage against
        # `mcp/mcp-red/src/...` (see aptl-mcp-common step for the same
        # reasoning).
        run: |
          cd mcp/mcp-red
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npx vitest run --coverage
          sed -i 's|^SF:|SF:mcp/mcp-red/|' coverage/lcov.info
      - name: dependent MCPs — build and run retained suites
        # Install fresh common before each consumer; build exactly once.
        run: |
          for manifest in mcp/*/package.json; do
            pkg=${manifest%/package.json}
            case "$pkg" in mcp/aptl-mcp-common|mcp/mcp-red) continue;; esac
            (
              cd "$pkg"
              npm ci --ignore-scripts --no-audit --no-fund
              npm run build
              if [ -d tests ]; then npx --no-install vitest run; fi
            )
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Restricted SSH transport against built MCP processes
        # Exercises real OpenSSH, dispatcher, relay and MCP processes. Deployment
        # observations are fixtures; this job does not boot or qualify a lab.
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          pip install --require-hashes -r requirements/dev.txt
          pip install -e . --no-deps --no-build-isolation
          coverage run --data-file=.coverage.transport -m pytest tests/test_mcp_transport_processes.py tests/test_mcp_payload_processes.py -q -m integration
          coverage xml --data-file=.coverage.transport -o coverage/transport.xml
      - name: Extracted MCP shutdown through the real capture sidecar
        # The installed red MCP, SSH broker and Docker harvest must agree on
        # the complete session census. Include real writer/container failures.
        # Prerequisite failures must fail this required lane, never skip it.
        run: |
          docker info > /dev/null
          command -v node ssh ssh-keygen
          python -m pytest tests/test_mcp_capture_lifecycle.py -q -m integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-transport-coverage
          path: coverage/transport.xml
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-coverage
          path: mcp/aptl-mcp-common/coverage/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-red-coverage
          path: mcp/mcp-red/coverage/
          retention-days: 7

  web-tests:
    name: Web frontend tests + coverage
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true')
    concurrency:
      group: checks-web-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/caddy-build/go.mod
          cache-dependency-path: web/caddy-build/go.sum
      - name: Verify Caddy security backport and configuration
        working-directory: web/caddy-build
        run: |
          go test -v .
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/caddy" .
          "$RUNNER_TEMP/caddy" validate --config ../Caddyfile --adapter caddyfile
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: |
          cd web
          npm ci
          npx svelte-kit sync
          npx vitest run --coverage
          sed -i 's|^SF:|SF:web/|' coverage/lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage
          path: web/coverage/
          retention-days: 7

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    # Audit the shipped platform closures and CI build tools. Intentionally
    # vulnerable lab targets remain in the separate advisory scanner jobs.
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.dependencies == 'true')
    concurrency:
      group: checks-dependency-audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: pip-audit (Python dependencies) — blocking
        # Generated, hash-pinned exports are the canonical CLI, API, and build
        # closures. No editable install or build hook runs during the scan.
        run: |
          set -euo pipefail
          pip install --require-hashes -r requirements/ci.txt
          pip-audit --require-hashes --disable-pip --strict \
            -r requirements/runtime.txt \
            -r requirements/web.txt \
            -r requirements/ci.txt \
            --progress-spinner=off
      - name: npm audit (JS/TS workspaces)
        run: |
          set -euo pipefail
          packages=(web/package.json mcp/*/package.json)
          for manifest in "${packages[@]}"; do
            test -f "$manifest"
            dir=${manifest%/package.json}
            test -f "$dir/package-lock.json"
            echo ""
            echo "=== $dir ==="
            (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund --silent && npm audit --omit=dev --audit-level=high)
          done

  # Trivy gates (ADR-026 amendment, issue #1193). Each scan job does two things:
  #   1. Records every CRITICAL/HIGH/MEDIUM finding, including vulnerabilities
  #      with no upstream fix yet, as SARIF: a short-retention artifact plus a
  #      GitHub code-scanning upload, where an alert stays open until a scan no
  #      longer reports it. That is how unfixed upstream problems stay tracked.
  #   2. Fails the job on any finding that has an available fix (and, for IaC
  #      and secrets, on any finding at all). `.trivyignore.yaml` holds the only
  #      waivers, each scoped to exact paths or package versions with its
  #      reason. Vulnerability waivers (temporary: no upstream fix yet) apply
  #      to the gate only, so those findings stay tracked in code scanning.
  #      Misconfiguration waivers are permanent design decisions and apply to
  #      the IaC record as well.
  # Code-scanning upload needs a token that can write security events, which
  # fork and Dependabot pull requests do not get; their gate still runs.
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    needs: [changes]
    if: always()
    concurrency:
      group: checks-trivy-fs-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record all findings (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM
          limit-severities-for-sarif: 'true'
      - name: Upload SARIF artifact
        if: (true) && (always())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-fs-sarif
          path: trivy-fs.sarif
          retention-days: 7
      - name: Track findings in code scanning
        if: (true) && (always() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Gate on fixable vulnerabilities and any secret
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: table
          exit-code: '1'
          ignore-unfixed: 'true'
          severity: CRITICAL,HIGH,MEDIUM
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: 'true'
      # The fixture is a text file, so no scan reads it as a manifest. A copy
      # named go.mod proves that the gate fails on a vulnerable Go module.
      - name: Prove that the scan fails on a vulnerable Go module
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          fixture=$(mktemp -d)
          cp tools/ci/testdata/go-vulnerable-module.txt "$fixture/go.mod"
          status=0
          trivy fs --scanners vuln --severity CRITICAL,HIGH,MEDIUM --ignore-unfixed --exit-code 3 "$fixture" || status=$?
          test "$status" -eq 3

  trivy-iac:
    name: Trivy IaC / config scan
    runs-on: ubuntu-latest
    # Dockerfile, Compose, and config misconfigurations. Distinct from
    # `trivy-fs` and `trivy-image` by design (ADR-026 § Boundaries).
    permissions:
      contents: read
      security-events: write
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.iac == 'true')
    concurrency:
      group: checks-trivy-iac-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Misconfiguration waivers are permanent, reviewed design decisions, so
      # the record honors them too; only unwaived misconfigurations are tracked.
      - name: Record all unwaived findings (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-iac.sarif
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM
          limit-severities-for-sarif: 'true'
          trivyignores: .trivyignore.yaml
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-iac-sarif
          path: trivy-iac.sarif
          retention-days: 7
      - name: Track findings in code scanning
        if: (needs.changes.outputs.iac == 'true') && (always() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
      - name: Gate on any misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH,MEDIUM
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: 'true'

  trivy-image:
    name: Trivy image scan — ${{ matrix.name }}
    runs-on: ubuntu-latest
    # One job per locally-built Dockerfile under `web/` and `containers/`.
    # Upstream-image-only services (wazuh/, misp/, etc.) are out of scope, as
    # are TechVault's base-container-materialized nodes (dns, fileshare, kali,
    # victim, webapp, workstation) (issues #581, #1193) — they start from the
    # generic base images scanned here and apply their SDL-declared state, with
    # no product Dockerfile of their own. A derived image builds its parent
    # first and names it by that exact build. ADR-026 calls out the cost of
    # one-image-per-job. These builds intentionally avoid buildx GHA layer
    # cache because expired cache blob URLs can fail the job before Trivy runs.
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base-rocky
            dockerfile: containers/base/Dockerfile.rocky
            context: ./containers
          - name: base-ubuntu
            dockerfile: containers/base/Dockerfile.ubuntu
            context: ./containers
          - name: appliance-egress-proxy
            dockerfile: containers/appliance-egress-proxy/Dockerfile
            context: .
          - name: generic-samba-ad-base
            dockerfile: containers/generic-samba-ad-base/Dockerfile
            context: ./containers/generic-samba-ad-base
          - name: generic-samba-ad-wazuh-agent-base
            dockerfile: containers/generic-samba-ad-wazuh-agent-base/Dockerfile
            context: .
            parent_dockerfile: containers/generic-samba-ad-base/Dockerfile
            parent_context: ./containers/generic-samba-ad-base
          - name: generic-systemd-base
            dockerfile: containers/generic-systemd-base/Dockerfile
            context: ./containers/generic-systemd-base
          - name: generic-systemd-wazuh-agent-base
            dockerfile: containers/generic-systemd-wazuh-agent-base/Dockerfile
            context: .
            parent_dockerfile: containers/generic-systemd-base/Dockerfile
            parent_context: ./containers/generic-systemd-base
          - name: generic-systemd-base-debian
            dockerfile: containers/generic-systemd-base-debian/Dockerfile
            context: .
          - name: generic-systemd-wazuh-agent-base-debian
            dockerfile: containers/generic-systemd-wazuh-agent-base-debian/Dockerfile
            context: .
            parent_dockerfile: containers/generic-systemd-base-debian/Dockerfile
            parent_context: .
          - name: generic-systemd-node22-base
            dockerfile: containers/generic-systemd-node22-base/Dockerfile
            context: .
          - name: generic-wazuh-agent-base-debian
            dockerfile: containers/generic-wazuh-agent-base-debian/Dockerfile
            context: .
          - name: kali-capture
            dockerfile: containers/kali-capture/Dockerfile
            context: .
          - name: network-boundary-helper
            dockerfile: containers/network-boundary-helper/Dockerfile
            context: .
          - name: operator-access-proxy
            dockerfile: containers/operator-access-proxy/Dockerfile
            context: .
          - name: suricata-wazuh-agent
            dockerfile: containers/suricata-wazuh-agent/Dockerfile
            context: .
          - name: misp-suricata-sync
            dockerfile: containers/misp-suricata-sync/Dockerfile
            context: .
          - name: web
            dockerfile: web/Dockerfile
            context: web
          - name: web-api
            dockerfile: web/Dockerfile.api
            context: .
    needs: [changes]
    if: always()
    concurrency:
      group: checks-trivy-image-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: contains(fromJSON(needs.changes.outputs.selected_images || '[]'), matrix.name)
        with:
          fetch-depth: 0
      # The `docker` driver builds in the daemon's own image store, so a child
      # build resolves the parent image built in the step before it.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: contains(fromJSON(needs.changes.outputs.selected_images || '[]'), matrix.name)
        with:
          driver: docker
      - name: Build parent image
        if: (contains(fromJSON(needs.changes.outputs.selected_images || '[]'), matrix.name)) && (matrix.parent_dockerfile != '')
        id: parent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.parent_context }}
          file: ${{ matrix.parent_dockerfile }}
          tags: aptl-scan/${{ matrix.name }}-parent:ci
          load: true
          push: false
      - name: Pin the parent by image ID
        if: (contains(fromJSON(needs.changes.outputs.selected_images || '[]'), matrix.name)) && (matrix.parent_dockerfile != '')
        id: pin
        env:
          PARENT_ID: ${{ steps.parent.outputs.imageid }}
          PARENT_REPO: aptl-scan/${{ matrix.name }}-parent
        run: |
          set -euo pipefail
          pin="${PARENT_REPO}:sha256-${PARENT_ID#sha256:}"
          docker tag "${PARENT_REPO}:ci" "$pin"
          echo "build-arg=APTL_PARENT_IMAGE=$pin" >> "$GITHUB_OUTPUT"
      - name: Build image
        if: contains(fromJSON(needs.changes.outputs.selected_images || '[]'), matrix.name)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ steps.pin.outputs.build-arg }}
          tags: aptl-scan/${{ matrix.name }}:ci
          load: true
          push: false
      - name: Record all findings (SARIF)
        if: contains(fromJSON(needs.changes.outputs.selected_images || '[]'), matrix.name)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aptl-scan/${{ matrix.name }}:ci
          vuln-type: os,library
          format: sarif
          output: trivy-image-${{ matrix.name }}.sarif
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM
          limit-severities-for-sarif: 'true'
      - name: Upload SARIF artifact
        if: (contains(fromJSON(needs.changes.outputs.selected_images || '[]'), matrix.name)) && (always())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-${{ matrix.name }}-sarif
          path: trivy-image-${{ matrix.name }}.sarif
          retention-days: 7
      - name: Track findings in code scanning
        if: (contains(fromJSON(needs.changes.outputs.selected_images || '[]'), matrix.name)) && (always() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}
      - name: Gate on fixable vulnerabilities
        if: contains(fromJSON(needs.changes.outputs.selected_images || '[]'), matrix.name)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aptl-scan/${{ matrix.name }}:ci
          vuln-type: os,library
          format: table
          exit-code: '1'
          ignore-unfixed: 'true'
          severity: CRITICAL,HIGH,MEDIUM
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: 'true'

  trivy-image-gate:
    name: Trivy image scan
    # The single required context for the image matrix: it fails unless every
    # matrix job succeeded, so a new image cannot be added without being gated.
    if: always()
    needs: [changes, trivy-image]
    runs-on: ubuntu-latest
    steps:
      - name: Require every image scan to pass
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
          RESULT: ${{ needs.trivy-image.result }}
        run: |
          test "$ROUTING_RESULT" = success
          test "$RESULT" = success || {
            echo "Trivy image scans did not all pass: $RESULT" >&2
            exit 1
          }

  osv-scanner:
    name: OSV-scanner (uv.lock)
    runs-on: ubuntu-latest
    # Blocking (issue #1193): covers the project-root `uv.lock` Python
    # dependency graph. Complements the `dependency-audit` job (pip-audit /
    # npm audit); ADR-026 § Risks notes OSV is not wired as a wholesale
    # replacement for the ecosystem audits.
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.dependencies == 'true')
    concurrency:
      group: checks-osv-scanner-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install osv-scanner (checksum-verified)
        # Pin to a specific release and verify the binary against the
        # publisher's SHA256SUMS manifest before exec'ing it. Without
        # verification a tampered release artifact would gain code
        # execution in the runner under the workflow's GITHUB_TOKEN.
        run: |
          set -euo pipefail
          version=v2.3.8
          asset=osv-scanner_linux_amd64
          base="https://github.com/google/osv-scanner/releases/download/${version}"
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          curl -sSL -o "${asset}" "${base}/${asset}"
          curl -sSL -o osv-scanner_SHA256SUMS "${base}/osv-scanner_SHA256SUMS"
          grep " ${asset}\$" osv-scanner_SHA256SUMS | sha256sum -c -
          sudo install -m 0755 "${asset}" /usr/local/bin/osv-scanner
      - name: Scan uv.lock
        # OSV-scanner v2 exits 0 (no vulns), 1 (vulns found), or other codes
        # for tool/CLI errors; any non-zero exit fails the job. The SARIF is
        # written before the exit, so the artifact below still records it.
        run: osv-scanner scan -L uv.lock --format sarif --output-file osv-scanner.sarif
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-scanner-sarif
          path: osv-scanner.sarif
          retention-days: 7

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true')
    concurrency:
      group: checks-go-lint-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: gofmt, go vet, go mod tidy, go fix, and golangci-lint (ADR-065)
        run: bash tools/ci/go-gates.sh lint

  go-tests:
    name: Go tests + coverage
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true')
    concurrency:
      group: checks-go-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Race-detected, shuffled tests with coverage, and the gate fixtures
        run: bash tools/ci/go-gates.sh test "$GITHUB_WORKSPACE/go-coverage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: go-coverage/
          retention-days: 7

  go-mutation:
    name: Go mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true')
    concurrency:
      group: checks-go-mutation-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # A pull request or a push mutates its changed production lines. A
      # scheduled or manual run, or a push without a valid base, mutates each
      # whole module.
      - name: Mutate the changed Go production lines
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base=
          case "$EVENT_NAME" in
            pull_request) base=$PR_BASE ;;
            push) base=$PUSH_BASE ;;
          esac
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" =~ ^0{40}$ ]]; then
            base=
          fi
          bash tools/ci/go-gates.sh mutation "$base"

  go-regression:
    name: Go regression tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true')
    permissions:
      contents: read
      issues: read
    concurrency:
      group: checks-go-regression-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      # ADR-065: the branch name gives the issue, and its labels give the bug
      # rule. A failed label lookup fails the job. This step is the only one
      # with the token, and it runs before the checkout, because the replay
      # runs the test code of the pull request.
      - name: Read the issue and the bug label of the branch
        id: issue
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=0
          bug=false
          if [[ "$HEAD_REF" =~ ^([1-9][0-9]{0,8})- ]]; then
            issue=${BASH_REMATCH[1]}
            labels=$(gh api "repos/$REPOSITORY/issues/$issue" --jq '[.labels[].name] | join(",")')
            echo "Issue #$issue labels: ${labels:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
            if [[ ",$labels," == *,bug,* ]]; then
              bug=true
            fi
          else
            echo "The branch names no issue." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "issue=$issue"
            echo "bug=$bug"
          } >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Replay the regression tests of the pull request
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ISSUE: ${{ steps.issue.outputs.issue }}
          BUG: ${{ steps.issue.outputs.bug }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo "No pull request, so no regression test is replayed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          bash tools/ci/go-gates.sh regression "$BASE_SHA" "$ISSUE" "$BUG"

  go-vuln:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true')
    concurrency:
      group: checks-go-vuln-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: govulncheck on the packages and the tools of each module
        run: bash tools/ci/go-gates.sh vuln

  osv-scanner-go:
    name: OSV-scanner (Go modules)
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true')
    concurrency:
      group: checks-osv-scanner-go-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Validate check selection
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner (checksum-verified)
        run: |
          set -euo pipefail
          version=v2.3.8
          asset=osv-scanner_linux_amd64
          base="https://github.com/google/osv-scanner/releases/download/${version}"
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          curl -sSL -o "${asset}" "${base}/${asset}"
          curl -sSL -o osv-scanner_SHA256SUMS "${base}/osv-scanner_SHA256SUMS"
          grep " ${asset}\$" osv-scanner_SHA256SUMS | sha256sum -c -
          sudo install -m 0755 "${asset}" /usr/local/bin/osv-scanner
      - name: Scan the first-party Go modules
        run: bash tools/ci/go-gates.sh osv
      # osv-scanner exits 1 for findings and with other codes for errors.
      - name: Prove that the scan fails on a vulnerable Go module
        run: |
          status=0
          osv-scanner scan source --no-call-analysis=go -L "go.mod:tools/ci/testdata/go-vulnerable-module.txt" || status=$?
          test "$status" -eq 1

  sonarcloud:
    name: SonarCloud quality gate
    needs: [changes, python-tests, mcp-tests, web-tests, go-tests]
    # Dependabot-triggered runs are handed the Dependabot secret store, not the
    # Actions one, so `secrets.SONAR_TOKEN` is empty and the scan can only ever
    # fail with "Not authorized or project not found". Mirroring the token into
    # Dependabot secrets would hand it to the very third-party action version
    # the PR is bumping, which defeats the SHA pinning above, so skip instead:
    # Dependabot never touches first-party source, so there is no new code for
    # the gate to judge. A job skipped by a condition reports success, which
    # keeps this satisfiable as a required check. Human PRs and pushes to
    # main/dev still run the full gate.
    if: always() && github.actor != 'dependabot[bot]' && (needs.changes.result != 'success' || needs.changes.outputs.python == 'true' || needs.changes.outputs.mcp == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.go == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: checks-sonarcloud-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-single
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Validate selected coverage producers
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
          PY_SELECTED: ${{ needs.changes.outputs.python }}
          PY_RESULT: ${{ needs.python-tests.result }}
          MCP_SELECTED: ${{ needs.changes.outputs.mcp }}
          MCP_RESULT: ${{ needs.mcp-tests.result }}
          WEB_SELECTED: ${{ needs.changes.outputs.web }}
          WEB_RESULT: ${{ needs.web-tests.result }}
          GO_SELECTED: ${{ needs.changes.outputs.go }}
          GO_RESULT: ${{ needs.go-tests.result }}
        run: |
          test "$ROUTING_RESULT" = success
          if [ "$PY_SELECTED" = true ]; then test "$PY_RESULT" = success; fi
          if [ "$MCP_SELECTED" = true ]; then test "$MCP_RESULT" = success; fi
          if [ "$WEB_SELECTED" = true ]; then test "$WEB_RESULT" = success; fi
          if [ "$GO_SELECTED" = true ]; then test "$GO_RESULT" = success; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: (needs.changes.outputs.python == 'true' || needs.changes.outputs.mcp == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.go == 'true')
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        if: (needs.changes.outputs.python == 'true' || needs.changes.outputs.mcp == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.go == 'true')
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Generate svelte-kit tsconfig (sonar reads web/tsconfig.json which extends it)
        if: (needs.changes.outputs.python == 'true' || needs.changes.outputs.mcp == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.go == 'true')
        run: |
          cd web
          npm ci --no-audit --no-fund --silent
          npx svelte-kit sync
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.python == 'true'
        with:
          name: python-coverage
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.mcp == 'true'
        with:
          name: python-transport-coverage
          path: coverage/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.mcp == 'true'
        with:
          name: mcp-coverage
          path: mcp/aptl-mcp-common/coverage/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.mcp == 'true'
        with:
          name: mcp-red-coverage
          path: mcp/mcp-red/coverage/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.web == 'true'
        with:
          name: web-coverage
          path: web/coverage/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.go == 'true'
        with:
          name: go-coverage
          path: go-coverage/
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        if: (needs.changes.outputs.python == 'true' || needs.changes.outputs.mcp == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.go == 'true')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
      - name: Fail on new SonarCloud issues
        if: ((needs.changes.outputs.python == 'true' || needs.changes.outputs.mcp == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.go == 'true')) && (github.ref_type != 'tag')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 tools/sonar/assert_no_new_issues.py --project-key Brad-Edwards_aptl --organization brad-edwards

  integration-qualification:
    name: Periodic and release integration qualification
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Prepare retained integration prerequisites
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install -e . --no-deps --no-build-isolation
          docker info > /dev/null
          docker compose version
          sudo apt-get update
          sudo apt-get install -y openssh-server
          bash mcp/build-all-mcps.sh
          python tools/ci/build_qualification_images.py
      - name: Run retained integration tests without contacting an operator lab
        run: python -m pytest tests/ -q -m "integration and not live_lab and not fuzz" --durations=30 --junitxml=integration-results.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-test-results
          path: integration-results.xml
          retention-days: 7
