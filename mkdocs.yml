site_name: LilRAE (formerly APTL)
site_description: A local Docker-based purple team lab infrastructure with Wazuh SIEM, containerized victim machines, and AI-powered red team operations
site_author: LilRAE maintainers
site_url: https://openrae.github.io/lilrae/
repo_url: https://github.com/OpenRAE/lilrae
repo_name: OpenRAE/lilrae

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - git-revision-date-localized:
      # Merge-only file additions can lack a creation commit in git log.
      # Show revision dates without inventing a build-time creation date.
      enable_creation_date: false
      # Page dates are best-effort, not a build gate: fall back to the
      # build date (instead of failing `mkdocs build --strict`) when git
      # history is unavailable for a page — uncommitted files, shallow
      # clones, and git worktrees (where plugin 1.5.x finds no logs).
      fallback_to_build_date: true
      enable_git_follow: false
      strict: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.keys
  - attr_list
  - md_in_html
  - toc:
      permalink: true

