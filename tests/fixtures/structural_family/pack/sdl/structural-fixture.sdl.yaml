variation_points:
  sensor-layout:
    kind: alternative
    target:
      kind: structural
      owner: sensor-9
      slot: nodes.presence
    alternatives:
      dark:
        kind: node-presence
        present: false
      watching:
        kind: node-presence
        present: true
        inventory:
          nodes.runtime.service_listeners:
          - nodes.sensor-9.runtime.service_listeners.active
  logging:
    kind: parameter
    target:
      kind: variable
      variable: verbosity
    domain:
      kind: enum
      values:
      - notice
      - debug
variables:
  verbosity:
    type: string
    default: notice
    allowed_values:
    - notice
    - debug
content:
  logging-config:
    type: file
    target: gateway
    path: /etc/redis/logging.conf
    text: 'loglevel ${verbosity}

      '
