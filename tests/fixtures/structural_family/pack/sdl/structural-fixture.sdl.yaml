name: structural-fixture
description: Synthetic scenario family with a structural sensor-presence factor.
nodes:
  gateway:
    type: compute
    os: linux
    resources:
      ram: 1 gib
      cpu: 1
    source:
      name: redis
      version: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  sensor-9:
    type: compute
    os: linux
    resources:
      ram: 1 gib
      cpu: 1
    runtime:
      service_listeners:
      - service_listener_id: active
        address: 0.0.0.0
        port: 6379
        protocol: tcp
      - service_listener_id: unused
        address: 0.0.0.0
        port: 6380
        protocol: tcp
    source:
      name: redis
      version: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
infrastructure:
  gateway:
    count: 1
  sensor-9:
    count: 1
agents:
