sonar.projectKey=Brad-Edwards_aptl
sonar.organization=brad-edwards

# Go code (ADR-065) keeps each test file next to its package. The Go test
# files are tests, and test data is neither source nor test.
sonar.sources=src,mcp,web/src,tools/cmd,tools/internal
sonar.tests=tests,mcp/aptl-mcp-common/tests,web/tests,tools/cmd,tools/internal,tools/gates
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/dist/**,**/.venv/**,**/build/**,**/*.pyc,**/containers/**,mcp/**/tests/**,web/**/tests/**,**/*_test.go,**/testdata/**
sonar.test.inclusions=tests/**,mcp/aptl-mcp-common/tests/**,web/tests/**,tools/**/*_test.go
sonar.coverage.exclusions=**/*.svelte

# tools/ci/go-gates.sh writes the Go profiles with repository paths.
sonar.go.coverage.reportPaths=go-coverage/*.out

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml,coverage/transport.xml

sonar.typescript.lcov.reportPaths=mcp/**/coverage/lcov.info,web/coverage/lcov.info

# core/lab.py exceeds the 500-line limit. Issue #1525 splits it by
# responsibility (ADR-064) and removes the lab.py entries.
sonar.issue.ignore.multicriteria=e1,e2,e4,e11,e12,e13,e17,e18,e19,e21,e22,e25,e26,e32,e33,e34,e35,e36,e37,e39,e40,e43,e44,e45,e46,e47,e48,e49,e51,e53,e55,e56,e58,e59,e60,e61,e62
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S104
sonar.issue.ignore.multicriteria.e1.resourceKey=src/aptl/core/lab.py
# python:S1722 is the Python-2 "old-style class" rule ("add inheritance from
# object"). With sonar.python.version=3.14 every class is already new-style, so
# the rule can only ever be a false positive — satisfying it means writing the
# `class Foo(object):` anti-pattern pyupgrade/ruff (UP004) tells you to remove.
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S1722
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.py
# These modules are cohesive protocol/schema or command surfaces. Splitting them
# solely at Sonar's 500-line threshold would separate validators from the signed
# models and commands they protect without reducing runtime complexity.
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S104
sonar.issue.ignore.multicriteria.e4.resourceKey=src/aptl/appliance/guest_observation.py
# The lifecycle module is one transactional seat state machine, and the lab CLI
# is an existing command surface. Both stay cohesive despite crossing the
# generic 500-line advisory threshold.
sonar.issue.ignore.multicriteria.e11.ruleKey=python:S104
sonar.issue.ignore.multicriteria.e11.resourceKey=src/aptl/appliance/seat/lifecycle.py
sonar.issue.ignore.multicriteria.e12.ruleKey=python:S104
sonar.issue.ignore.multicriteria.e12.resourceKey=src/aptl/cli/lab.py
# Stable CLI commands and security-orchestration entry points use keyword-only
# parameters to make trust inputs explicit. Collapsing them into untyped option
